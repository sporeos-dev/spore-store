# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d2/spore.manifest.v0.schema.yaml

id: dev.sporeos.store
name: Store
description: The Spore OS store.
trust: system

version: 0.1.0
schema: SPORE/v0d2
app: ./store

launch: lazy
namespace: hyphae

api: 
  - name: refresh
    description: Refresh the list of available nodes in the store.
    risk: standard
    usage:
      - store.refresh
    inputs: []
    outputs: []

  - name: browse
    description: Browse available nodes in the store.
    risk: standard
    usage:
      - store.browse
    inputs: []
    outputs: 
      - name: nodes
        type: array
        description: List of available nodes in the store.

  - name: details
    description: Get details about a specific node in the store.
    risk: standard
    usage:
      - store.details node=node.id
    inputs:
      - name: node
        type: string
        description: Node identifier.
        required: true
    outputs:
      - name: details
        type: object
        description: Detailed information about the specified node.

  - name: get
    description: Get a specific node from the store.
    risk: standard
    usage:
      - store.get node=node.id
    inputs:
      - name: node
        type: string
        description: Node identifier.
        required: true
    outputs:
      - name: path
        type: string
        description: Path to the retrieved node from the store.
  
topics: []
permissions: []
errors: []
