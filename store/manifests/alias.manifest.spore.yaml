id: dev.sporeos.foundry.alias
name: Alias
description: An easy-to-use terminal aliasing mechanism that simplifies execution and manages context.
trust: standard

schema: SPORE/v0d2
version: 0.1.33
app: ./foundry-alias

roles:
  - raw
  - hint

launch: lazy
namespace: hyphae

api: 
  - name: add
    description: Adds a new alias.
    risk: standard
    usage:
      - alias.add alias=alias_id path=path/to/script description="Description of the alias."
    inputs:
      - name: alias
        type: string
        description: The name of the alias to be added. This is a unique identifier.
        required: true
      - name: path
        type: string
        description: The path to the script that the alias will execute. Adding the alias grants the script execute permission.
        required: true
      - name: description
        type: string
        description: A brief description of the alias.
      - name: overwrite
        type: flag
        description: If true, an existing alias can be overwritten. 
    outputs: []

  - name: remove
    description: Removes an existing alias.
    risk: standard
    usage:
      - alias.remove alias=alias_id
    inputs: 
      - name: alias
        type: string
        description: The name of the alias to be removed.
        required: true
    outputs: []

  - name: run
    description: Executes the specified alias.
    risk: standard
    usage:
      - alias.run alias=alias_id path=/path/to/run/directory
    inputs:
      - name: alias
        type: string
        description: The name of the alias to be executed.
        required: true
      - name: path
        type: string
        description: The path to the directory where the alias will be executed.
        required: false
      - name: cwd
        type: string
        description: The current working directory to be used if the path is not specified.
        required: false
    outputs: 
      - name: output
        type: string
        description: The output generated by executing the alias.
    notes:
      - Raw input [ "alias alias_id" ] will call this on the corresponding alias.
      - Path takes precedence over cwd if both are specified.
      - One of path or cwd may be required, dependent on the specified alias.

  - name: context.add
    description: Adds a piece of data to a directory context. If available and unspecified, the context will be the current working directory.
    risk: standard
    usage:
      - context.add key=key value=value
      - context.add key=key value=value path=/path/to/directory
    inputs:
      - name: key
        type: string
        description: The key for the context to be added.
        required: true
      - name: value
        type: string
        description: The value for the context to be added.
        required: true
      - name: path
        type: string
        description: The path to the directory where the context will be added.
        required: false
      - name: cwd
        type: string
        description: The current working directory to be used if the path is not specified.
        required: false
    outputs: []
    notes:
      - Path takes precedence over cwd if both are specified.
      - One of path or cwd must be specified.

  - name: context.remove
    description: Removes a piece of data from a directory context. If available and unspecified, the context will be the current working directory.
    risk: standard
    usage:
      - context.remove key=key
      - context.remove key=key path=/path/to/directory
    inputs:
      - name: key
        type: string
        description: The key for the context to be removed.
        required: true
      - name: path
        type: string
        description: The path to the directory where the context will be removed.
        required: false
      - name: cwd
        type: string
        description: The current working directory to be used if the path is not specified.
        required: false
    outputs: []
    notes:
      - Path takes precedence over cwd if both are specified.
      - One of path or cwd must be specified.

  - name: context.clear
    description: Clears all data from a directory context. If available and unspecified, the context will be the current working directory.
    risk: standard
    usage:
      - context.clear
      - context.clear path=/path/to/directory
    inputs:
      - name: path
        type: string
        description: The path to the directory where the context will be cleared.
        required: false
      - name: cwd
        type: string
        description: The current working directory to be used if the path is not specified.
        required: false
    outputs: []
    notes:
      - Path takes precedence over cwd if both are specified.
      - One of path or cwd must be specified.

permissions:
  - name: dev.sporeos.SPORE.state.persist
    reasons:
      - To persist script aliases across sessions.
  - name: dev.sporeos.SPORE.state.retrieve
    reasons:
      - To retrieve saved script aliases.
      
topics: []
errors: []
